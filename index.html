<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muuni Open Data</title>
<meta name="description" content="Live, open weather and soil data from the Muuni low-cost station in Malawi. Free to download and use.">
<meta property="og:title" content="Muuni Open Weather & Soil Station">
<meta property="og:description" content="Live open weather and soil data from Malawi. Open hardware, open source, open data.">
<meta name="theme-color" content="#1E6B45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EB; --card:#FFFFFF; --ink:#17221B; --muted:#5E6862; --line:#E4E0D5; --chip:#ECEBE6;
  --green:#1E6B45; --green-soft:#E3EFE6; --blue:#1D5FA8; --blue-soft:#E3ECF9;
  --amber:#8A4F00; --amber-soft:#FBEFD9; --red:#A3261B; --red-soft:#F8E1DE;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--green)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}

/* top bar like the app */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 0 6px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px;letter-spacing:-.6px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center}
.lang{display:flex;background:var(--green);border-radius:999px;padding:4px}
.lang button{border:0;background:transparent;color:#fff;font:inherit;font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer}
.lang button.on{background:#fff;color:var(--green)}
.place{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;margin:4px 0 10px}
.badges{display:flex;flex-wrap:wrap;gap:4px 14px}
.badge{color:var(--green);font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--green)}
.tagline{margin:10px 0 0;font-size:15px;color:var(--muted);max-width:640px}

nav{position:sticky;top:0;z-index:20;background:#F3F1EB;box-shadow:0 2px 6px rgba(23,34,27,.06);border-bottom:1px solid var(--line);margin-top:14px}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px 13px;border-radius:999px}
nav a:hover,nav a:focus{background:var(--green-soft);color:var(--green)}

section{padding:22px 0 4px;scroll-margin-top:60px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h2{font-size:22px;margin:0;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 12px}

.pill{font-size:11px;font-weight:800;letter-spacing:1px;white-space:nowrap;background:none!important;padding:0}
.pill.m{background:var(--green-soft);color:var(--green)}
.pill.old{background:var(--chip);color:var(--muted)}
.pill.f{background:var(--blue-soft);color:var(--blue)}
.pill.o{color:#8A4F00}
.statuspill{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:12px}
.statuspill.ok{color:var(--green)}
.dot{width:9px;height:9px;border-radius:5px;background:#7A817D}.statuspill.ok .dot{background:#22A05A}

.banner{border-radius:18px;padding:14px 16px;font-size:14px;display:flex;gap:12px;align-items:flex-start}
.banner.amber{background:var(--amber-soft);color:#5E3700}
.banner.grey{background:var(--chip);color:var(--ink)}
.banner b{display:block}

/* ---------- animated sky card ---------- */
.sky{position:relative;border-radius:28px;overflow:hidden;color:#fff;min-height:290px;padding:22px 22px 70px;
  background:linear-gradient(180deg,#2C67B0 0%,#5F97D3 70%,#8DB8E3 100%);isolation:isolate}
.sky.night{background:linear-gradient(180deg,#0B1830 0%,#1C3360 70%,#2B4877 100%)}
.sky.old{background:linear-gradient(180deg,#2F4E78 0%,#4E6E96 70%,#6886AA 100%)}
.sky.old .skytext{color:#D9E1EA}
.sky .layer{position:absolute;inset:0;z-index:-1;pointer-events:none}
.sun{position:absolute;right:-95px;top:-75px;width:300px;height:300px;pointer-events:none}
.sun .halo{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,253,240,.95) 0%,rgba(255,246,210,.75) 9%,rgba(255,236,180,.42) 18%,rgba(255,228,160,.18) 32%,rgba(255,220,150,.06) 48%,rgba(255,220,150,0) 66%);
  animation:glow 6s ease-in-out infinite alternate}
.sun .rays{position:absolute;inset:-10%;border-radius:50%;opacity:.22;filter:blur(3px);
  background:repeating-conic-gradient(from 0deg,rgba(255,250,225,.9) 0deg 2deg,rgba(255,250,225,0) 2deg 11deg);
  -webkit-mask:radial-gradient(circle,#000 8%,rgba(0,0,0,.5) 25%,transparent 55%);mask:radial-gradient(circle,#000 8%,rgba(0,0,0,.5) 25%,transparent 55%);
  animation:spin 140s linear infinite}
.sun .core{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle,#FFFFFF 0%,#FFFEF6 55%,#FFF4C9 85%,#FFE7A0 100%);
  box-shadow:0 0 18px 6px rgba(255,252,235,.95),0 0 46px 18px rgba(255,236,170,.55),0 0 110px 50px rgba(255,220,140,.22)}
.flare{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.sky.old .sun{opacity:.55;filter:saturate(.6)}
.sky.old .flare{display:none}
@keyframes glow{from{transform:scale(.97);opacity:.92}to{transform:scale(1.03);opacity:1}}
.moon{position:absolute;right:40px;top:70px;width:64px;height:64px;border-radius:50%;box-shadow:-14px 6px 0 0 #EDE6CF;transform:rotate(-20deg)}
.star{position:absolute;width:2px;height:2px;border-radius:1px;background:#fff;opacity:.7;animation:tw 3s ease-in-out infinite}
.track{position:absolute;left:0;width:100%;animation:drift linear infinite;will-change:transform}
.cloud{position:absolute;left:0;top:0}
.cloud .cl{position:absolute;border-radius:50%}
.cl.base{background:radial-gradient(closest-side,rgba(170,186,208,.95),rgba(170,186,208,.65) 55%,rgba(170,186,208,0))}
.cl.top{background:radial-gradient(closest-side,#fff,rgba(255,255,255,.85) 45%,rgba(255,255,255,0))}
.sky.old .cloud,.sky.night .cloud{opacity:.55}
.sky .skytop,.sky .bigt,.sky .cond,.skyrow{text-shadow:0 1px 8px rgba(20,45,80,.35)}
.drop{position:absolute;top:-20px;width:2px;height:14px;border-radius:1px;background:rgba(220,235,255,.75);animation:fall linear infinite}
.crops{position:absolute;left:0;bottom:0;width:100%;height:64px;display:block}
.flyer{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.plane-trail{position:absolute;top:50%;right:100%;height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75));filter:blur(.5px)}
.navlight{position:absolute;width:3px;height:3px;border-radius:2px;animation:blink 1.3s steps(1) infinite}
@keyframes blink{0%{opacity:1}12%{opacity:0}}
.crops .plant{transform-origin:50% 100%;animation:sway ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(calc(-100% + -320px))}to{transform:translateX(100%)}}
@keyframes fall{to{transform:translateY(340px)}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
@keyframes tw{50%{opacity:.15}}
@keyframes bob{from{transform:translateY(-2px)}to{transform:translateY(3px)}}
@media (prefers-reduced-motion:reduce){.sun .rays,.sun .halo,.track,.drop,.crops .plant,.star{animation:none!important}}

.skytop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.skytext{font-size:17px;font-weight:700}
.sky .pill.m{color:#fff}
.sky .pill.old{color:#E8EDF3}
.bigt{font-size:84px;font-weight:800;letter-spacing:-4px;line-height:1;margin:14px 0 4px}
.cond{font-size:17px;opacity:.95}
.skyrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-top:1px solid rgba(255,255,255,.3);margin-top:18px;padding-top:12px;position:relative;z-index:2}
.skyrow .k{color:rgba(255,255,255,.85);font-size:13px;font-weight:600}
.skyrow .v{font-size:22px;font-weight:800;letter-spacing:-.5px}

@media(max-width:370px){
  .bigt{font-size:66px;letter-spacing:-3px}
  .sun{width:240px;height:240px;right:-75px;top:-50px}.sun .core{width:50px;height:50px;margin:-25px 0 0 -25px}
  .skyrow .k{font-size:11px}.skyrow .v{font-size:19px}
  .wind{grid-template-columns:120px 1fr}#compass{width:120px;height:120px}.wind .big{font-size:44px}
  .fclist .row{grid-template-columns:minmax(0,1fr) 26px 50px 32px 28px;gap:6px;font-size:14px}
}
/* ---------- icon cards (like the app) ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:330px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ic{background:var(--card);border-radius:18px;padding:12px 11px}
.ic .h{display:flex;align-items:flex-start;gap:6px}
.ic svg.i{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.ic .k{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.ic .v{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin-top:6px;white-space:nowrap}
.ic .v small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:2px}
.ic.old .v{color:#6D7570}
.chip{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;line-height:1.3}
.chip.amber{color:var(--amber)}
.chip.grey{color:var(--muted)}
.n{font-size:12px;color:var(--muted);margin-top:4px}

.card{background:var(--card);border-radius:24px;padding:18px}
.k2{font-size:13px;color:var(--muted);font-weight:700}

/* wind card */
.wind{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.wind .big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
.wind .big small{font-size:18px;color:var(--muted);font-weight:600;letter-spacing:0}
.wstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.wstats .k{font-size:13px;color:var(--muted)}.wstats .v{font-size:22px;font-weight:800}

/* forecast list */
.fclist .row{display:grid;grid-template-columns:1fr 32px 62px 40px 34px;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.fclist .row:last-child{border-bottom:0}
.fclist .row.far{opacity:.62}
.fcdiv{font-size:12px;font-weight:700;color:var(--muted);padding:10px 0 6px;border-bottom:1px solid var(--line)}
.pill.o{color:#8A4F00}
.olist .orow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.olist .orow:last-child{border-bottom:0}
.olist .when{font-weight:800}.olist .when small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.olist .tag{display:flex;align-items:center;gap:6px;font-weight:600}
.olist .tag.wet{color:#1D5FA8}.olist .tag.dry{color:#8A4F00}.olist .tag.norm{color:var(--muted)}
.olist .tag.warm{color:#B4471B}.olist .tag.cool{color:#1D5FA8}
.fclist .d{font-weight:700}
.fclist .c{color:var(--muted);font-size:13px;font-weight:500;margin-top:1px}
.fclist .p{color:var(--blue);font-weight:600;font-size:15px;display:flex;align-items:center;gap:2px}
.fclist .hi{font-weight:800;text-align:right}.fclist .lo{color:var(--muted);text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini .t{font-size:18px;font-weight:800}
.mini .v{font-size:34px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:8px;margin-top:8px}
.mini .n{font-size:15px}

/* advice */
.adv .item{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.adv .item:last-child{border-bottom:0}
.adv .ib{display:flex;justify-content:center;padding-top:2px}
.adv .cat{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.adv .ttl{font-size:18px;font-weight:800;line-height:1.3;margin-top:4px}
.adv .ttl.good{color:var(--green)}.adv .ttl.caution{color:var(--amber)}.adv .ttl.no{color:var(--red)}
.adv ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}

.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--green);color:#fff}
.charts{display:grid;gap:10px}
@media(min-width:640px){.charts{grid-template-columns:1fr 1fr}}
svg.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}

form.dl{display:grid;gap:10px}
@media(min-width:640px){form.dl{grid-template-columns:repeat(4,1fr)}}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
select,input{width:100%;font:inherit;font-size:15px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:13px 22px;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--green);border:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:#F0EEE7;border-radius:12px;padding:10px;display:block;margin-top:6px}
h3{margin:20px 0 8px;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;border-radius:18px;background:var(--card)}
.lic{display:grid;gap:10px}
@media(min-width:640px){.lic{grid-template-columns:repeat(3,1fr)}}
.lic .name{font-size:18px;font-weight:800;margin:4px 0}
footer{color:var(--muted);font-size:13px;padding:26px 0 44px}
@media(max-width:370px){.fclist .row{grid-template-columns:minmax(0,1fr) 26px 50px 32px 28px;gap:6px;font-size:14px}.olist .orow{font-size:13px;gap:6px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="cf0" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="5" seed="3"/><feDisplacementMap in="SourceGraphic" scale="75" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="1"/></filter>
  <filter id="cf1" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="5" seed="11"/><feDisplacementMap in="SourceGraphic" scale="65" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="1"/></filter>
  <filter id="cf2" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="5" seed="27"/><feDisplacementMap in="SourceGraphic" scale="85" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="1.2"/></filter>
</svg>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2C14E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#F2C14E"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></div>
      Muuni
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" class="on" onclick="setLang('en')">EN</button>
      <button id="lang-ny" onclick="setLang('ny')">CH</button>
    </div>
  </div>
  <div class="place"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="place"></span></div>
  <p class="tagline" data-i18n="tagline"></p>
</div>

<nav><div class="wrap">
  <a href="#live" data-i18n="nav_live"></a>
  <a href="#forecast" data-i18n="nav_fc"></a>
  <a href="#advice" data-i18n="nav_adv"></a>
  <a href="#rain" data-i18n="nav_rain"></a>
  <a href="#charts" data-i18n="nav_charts"></a>
  <a href="#download" data-i18n="nav_dl"></a>
  <a href="#health" data-i18n="nav_health"></a>
  <a href="#open" data-i18n="nav_open"></a>
  <a href="#about" data-i18n="nav_about"></a>
</div></nav>

<main class="wrap">


  <!-- LIVE -->
  <section id="live">
    <div class="sh"><h2 data-i18n="live_h"></h2><span id="live-pill" class="pill m" data-i18n="measured"></span></div>
    <div id="status" class="statuspill"><span class="dot"></span><span id="st-text" data-i18n="loading"></span></div>

    <div id="sky" class="sky">
      <div class="layer" id="sky-layer"></div>
      <div class="layer" id="sky-fly"></div>
      <div class="skytop"><div class="skytext" id="sky-when">—</div><span class="pill m" id="sky-pill" data-i18n="measured"></span></div>
      <div class="bigt" id="sky-temp">—</div>
      <div class="cond" id="sky-cond"></div>
      <div class="skyrow">
        <div><div class="k" data-i18n="hum"></div><div class="v" id="sk-h">—</div></div>
        <div><div class="k" data-i18n="dew"></div><div class="v" id="sk-d">—</div></div>
        <div><div class="k" data-i18n="pres"></div><div class="v" id="sk-p">—</div></div>
        <div><div class="k" data-i18n="wind"></div><div class="v" id="sk-w">—</div></div>
      </div>
      <svg class="crops" id="crops" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>

    <div class="sh" style="margin-top:22px"><h2 style="font-size:19px" data-i18n="readings_h"></h2><span id="rd-pill" class="pill m" data-i18n="measured"></span></div>
    <div class="grid3" id="live-grid"></div>

    <div class="card" style="margin-top:10px">
      <div class="sh" style="margin-bottom:6px"><div style="font-size:18px;font-weight:800" data-i18n="wind"></div><span id="wind-pill" class="pill m" data-i18n="measured"></span></div>
      <div class="wind">
        <svg id="compass" viewBox="0 0 150 150" width="150" height="150" aria-hidden="true"></svg>
        <div><div class="big" id="w-big">—</div><div id="w-dir" style="color:var(--green);font-weight:700;margin-top:6px"></div></div>
      </div>
      <div class="wstats">
        <div><div class="k" data-i18n="avg30"></div><div class="v" id="w-avg">—</div></div>
        <div><div class="k" data-i18n="gust_k"></div><div class="v" id="w-gust">—</div></div>
        <div><div class="k">Beaufort</div><div class="v" id="w-bf">—</div></div>
      </div>
    </div>
  </section>

  <!-- FORECAST -->
  <section id="forecast">
    <div class="sh"><h2 data-i18n="fc_h"></h2><span class="pill f" data-i18n="forecast"></span></div>
    <p class="sub" data-i18n="fc_sub"></p>
    <div class="card fclist" id="fc-list" style="padding:4px 18px"></div>

function wxKind(c){ if (c===0) return "clear"; if (c<=2) return "partly"; if (c===3) return "cloudy"; if (c===45||c===48) return "fog"; if (c>=51&&c<=57) return "drizzle"; if (c>=95) return "storm"; if (c>=61) return "rain"; return "cloudy"; }
const wxIcon = (kind, s=26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#1D5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#1D5FA8">${WX[kind]}</svg>`;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const num = v => { if (v === null || v === undefined || v === "") return null; const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const fmt = (v, d=1) => v === null || v === undefined || !Number.isFinite(v) ? "—" : v.toFixed(d);
const tsBase = "https://api.thingspeak.com/channels/";
const dkFmt = new Intl.DateTimeFormat("en-CA",{timeZone:CFG.tz});
const todayKey = () => dkFmt.format(new Date());
const dayKeyOffset = n => dkFmt.format(new Date(Date.now()-n*864e5));
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = deg => deg === null ? "" : COMPASS[Math.round(((deg%360)+360)%360/22.5)%16];
const beaufort = v => v === null ? null : [0.3,1.6,3.4,5.5,8,10.8,13.9,17.2,20.8,24.5,28.5,32.7].findIndex(x => v < x) < 0 ? 12 : [0.3,1.6,3.4,5.5,8,10.8,13.9,17.2,20.8,24.5,28.5,32.7].findIndex(x => v < x);
const dewPoint = (T,RH) => { if (T===null||RH===null||RH<=0) return null; const a=17.62,b=243.12,g=Math.log(RH/100)+a*T/(b+T); return b*g/(a-g); };
const hhmm = ms => new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:CFG.tz}).format(new Date(ms));
function agoText(ms){ const m = Math.round(ms/60000); if (m < 60) return `${m} ${t("min")} ${t("ago")}`; const h = Math.round(m/60); if (h < 48) return `${h} ${t("h")} ${t("ago")}`; return `${Math.round(h/24)} ${t("d")} ${t("ago")}`; }
async function getJSON(url){ const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }

/* ---------- state ---------- */
const S = { wLast:null, sLast:null, wSeries:[], sSeries:[], wChan:null, sChan:null, fc:null, range:1, err:false, skyKey:"" };

async function loadAll(){
  const w = CFG.weather, s = CFG.soil, tz = encodeURIComponent(CFG.tz);
  const startD = new Date(Math.min(Date.parse(CFG.seasonStart+"T00:00:00+02:00"), Date.now()-8*864e5));
  const start = dkFmt.format(startD) + "%2000:00:00";
  const jobs = [
    getJSON(`${tsBase}${w.id}/feeds/last.json?api_key=${w.key}&timezone=${tz}`).then(d=>S.wLast=d),
    getJSON(`${tsBase}${s.id}/feeds/last.json?api_key=${s.key}&timezone=${tz}`).then(d=>S.sLast=d),
    getJSON(`${tsBase}${w.id}/feeds.json?api_key=${w.key}&timezone=${tz}&average=10&start=${start}`).then(d=>{S.wSeries=d.feeds||[];S.wChan=d.channel;}),
    getJSON(`${tsBase}${s.id}/feeds.json?api_key=${s.key}&timezone=${tz}&average=10&days=8`).then(d=>{S.sSeries=d.feeds||[];S.sChan=d.channel;}),
    getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}&current=temperature_2m,weather_code,cloud_cover,is_day&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,uv_index_max&timezone=${tz}&wind_speed_unit=ms&forecast_days=16`).then(d=>S.fc=d)
  ];
  const res = await Promise.allSettled(jobs);
  S.err = res.slice(0,2).every(r => r.status === "rejected");
  render();
}

/* ---------- derived ---------- */
function isStale(e){ if (!e || !e.created_at) return true; return (Date.now() - Date.parse(e.created_at)) > CFG.staleMinutes*60000; }
function rainByDay(){
  const out = {}; let prev = null;
  for (const e of S.wSeries){
    const v = num(e.field6); if (v === null) continue;
    if (prev !== null){ const inc = v >= prev ? v - prev : v; const k = e.created_at.slice(0,10); out[k] = (out[k]||0) + inc; }
    prev = v;
  }
  return out;
}
function series(list, f){ return list.map(e => ({t:Date.parse(e.created_at), v:num(e[f])})).filter(p => p.v !== null && Number.isFinite(p.t)); }
function hourIndexNow(){
  const f = S.fc; if (!f || !f.hourly) return -1;
  const now = Date.now(); const idx = f.hourly.time.findIndex(x => Date.parse(x+":00+02:00") > now);
  return idx <= 0 ? 0 : idx - 1;
}

/* ---------- render ---------- */
function render(){
  document.documentElement.lang = LANG === "ny" ? "ny" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("lang-en").classList.toggle("on", LANG==="en"); $("lang-ny").classList.toggle("on", LANG==="ny");
  $("place").textContent = L(CFG.place);
  renderLive(); renderForecast(); renderOutlook(); renderAdvice(); renderRain(); renderCharts(); renderDownload(); renderHealth(); renderStatic();
}

function setPill(el, stale){ el.className = "pill " + (stale ? "old" : "m"); el.textContent = stale ? t("measured_old") : t("measured"); }
function ic(iconKey, k, v, unit, extra, stale){
  return `<div class="ic${stale?" old":""}"><div class="h">${icon(iconKey)}<div class="k">${k}</div></div><div class="v">${v}${unit && v!=="—"?`<small>${unit}</small>`:""}</div>${extra||""}</div>`;
}

function renderLive(){
  const w = S.wLast, s = S.sLast, st = $("status"), txt = $("st-text");
  const stale = isStale(w), sStale = isStale(s);
  ["live-pill","sky-pill","rd-pill","wind-pill","rain-pill"].forEach(id => setPill($(id), stale));
  if (S.err){ st.className = "statuspill"; txt.textContent = t("noconn"); }
  else if (w && w.created_at){
    const when = Date.parse(w.created_at);
    st.className = "statuspill" + (stale ? "" : " ok");
    txt.textContent = stale ? `${t("offline")} · ${t("last_seen")} ${agoText(Date.now()-when)}` : `${t("online")} · ${t("last_reading")} ${agoText(Date.now()-when)}`;
  }
  const T0 = w?num(w.field1):null, RH = w?num(w.field2):null, P = w?num(w.field3):null, WS = w?num(w.field4):null, WD = w?num(w.field5):null, G = w?num(w.field7):null, R1 = w?num(w.field8):null;
  // sky card
  $("sky-when").textContent = w && w.created_at ? `${t("last_reading")} · ${hhmm(Date.parse(w.created_at))}` : "—";
  $("sky-temp").textContent = T0 === null ? "—" : `${fmt(T0)}°`;
  const cur = S.fc && S.fc.current;
  $("sky-cond").textContent = cur ? `${t("w_"+wxKind(cur.weather_code))} · ${t("cloud")} ${cur.cloud_cover}%` : "";
  $("sk-h").textContent = RH===null?"—":`${fmt(RH,0)}%`;
  $("sk-d").textContent = (()=>{ const d = dewPoint(T0,RH); return d===null?"—":`${fmt(d)}°`; })();
  $("sk-p").textContent = P===null?"—":fmt(P,0);
  $("sk-w").textContent = WS===null?"—":`${fmt(WS)}`;
  drawSky(stale, cur, WS, R1);

  // icon cards
  const sm = s?num(s.field1):null, ph = s?num(s.field4):null, ecv = s?num(s.field3):null, out = sm !== null && sm < 5;
  const poor = !out && sm !== null && ecv === 0;   // EC of 0 with moisture present = probe not touching soil properly
  const rdToday = rainByDay()[todayKey()];
  let smChip = ""; if (out) smChip = `<span class="chip amber">⚠ ${t("notsoil")}</span>`; else if (poor) smChip = `<span class="chip amber">⚠ ${t("poor")}</span>`; else if (sm !== null && sm < 10) smChip = `<span class="chip amber">⚠ ${t("check")}</span>`;
  const bad = out || poor, phBad = ph !== null && (ph < 3.5 || ph > 9.5);
  const badChip = poor ? `<span class="chip amber">${t("poor")}</span>` : "";
  $("live-grid").innerHTML =
    ic("drop", t("rain_today"), S.wSeries.length ? fmt(rdToday||0) : "—", "mm", "", stale) +
    ic("wind", t("wind"), fmt(WS), "m/s", `<div class="n">${WD!==null?compass(WD):"—"}</div>`, stale) +
    ic("gauge", t("pres"), fmt(P,0), "hPa", "", stale) +
    ic("dropHalf", t("soilm"), out ? "—" : fmt(sm,0), "%", smChip, sStale) +
    ic("flask", t("ph"), bad ? "—" : fmt(ph), "", bad ? badChip : (phBad ? `<span class="chip grey">${t("unrel")}</span>` : ""), sStale) +
    ic("therm", t("soilt"), fmt(s?num(s.field2):null), "°C", "", sStale) +
    ic("bolt", t("ec"), bad ? "—" : fmt(ecv,0), "µS/cm", badChip, sStale) +
    ic("leaf", t("npk"), bad ? "—" : [5,6,7].map(i=>fmt(s?num(s["field"+i]):null,0)).join("/"), "", bad ? badChip : `<div class="n">mg/kg</div>`, sStale).replace('class="v"','class="v" style="font-size:17px;letter-spacing:-.5px"') +
    ic("therm", t("air"), fmt(T0), "°C", "", stale);

  // wind card
  $("w-big").innerHTML = WS===null ? "—" : `${fmt(WS)}<small> m/s</small>`;
  $("w-dir").textContent = WD===null ? "—" : `${compass(WD)} · ${Math.round(WD)}°`;
  $("w-avg").textContent = WS===null?"—":`${fmt(WS)} m/s`;
  $("w-gust").textContent = G===null?"—":`${fmt(G)} m/s`;
  const bf = beaufort(WS); $("w-bf").textContent = bf===null?"—":bf;
  drawCompass(WD, stale);
}

function drawCompass(deg, stale){
  const c = 75, r = 66; let ticks = "";
  for (let i=0;i<16;i++){ const a=i*22.5*Math.PI/180, r1=i%4===0?r-12:r-7; ticks += `<line x1="${c+Math.sin(a)*r1}" y1="${c-Math.cos(a)*r1}" x2="${c+Math.sin(a)*(r-2)}" y2="${c-Math.cos(a)*(r-2)}" stroke="#D9D4C7" stroke-width="2" stroke-linecap="round"/>`; }
  const lab = [["N",c,24],["E",128,c+5],["S",c,132],["W",22,c+5]].map(([s,x,y])=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="15" font-weight="800" fill="${s==="N"?"#1E6B45":"#56615A"}" font-family="inherit">${s}</text>`).join("");
  const needle = deg===null ? "" : `<g transform="rotate(${deg} ${c} ${c})" style="transition:transform .8s"><path d="M${c} ${c-46} L${c-7} ${c} L${c+7} ${c} Z" fill="#E7E2D6"/><path d="M${c} ${c+46} L${c-7} ${c} L${c+7} ${c} Z" fill="${stale?"#9AA3AF":"#1E6B45"}"/></g>`;
  $("compass").innerHTML = `<circle cx="${c}" cy="${c}" r="${r+4}" fill="#F7F5EF" stroke="#E4E0D5" stroke-width="2"/>${ticks}${lab}${needle}<circle cx="${c}" cy="${c}" r="6" fill="#3B4540"/>`;
}

/* animated sky: sun/moon, clouds by cloud cover, rain drops, maize swaying with wind */
function drawSky(stale, cur, wind, rain1h){
  const isDay = cur ? cur.is_day === 1 : (()=>{ const h = +new Intl.DateTimeFormat("en-GB",{hour:"numeric",hour12:false,timeZone:CFG.tz}).format(new Date()); return h>=6 && h<18; })();
  const cc = cur ? cur.cloud_cover : 30;
  const raining = (!stale && rain1h !== null && rain1h > 0) || (cur && [51,53,55,61,63,65,80,81,82,95,96,99].includes(cur.weather_code));

  let h = "";

    [[.62,.5,22,"rgba(255,240,200,.10)"],[.48,.66,12,"rgba(200,230,255,.12)"],[.36,.8,34,"rgba(255,225,190,.06)"]].forEach(([x,y,r,c]) =>

  }

  const nClouds = Math.max(2, Math.round(cc/14)) + (raining?2:0);
  for (let i=0;i<nClouds;i++){
    const w = 170 + Math.random()*130, top = -10 + Math.random()*120, dur = 90 + Math.random()*70, delay = -Math.random()*dur;

      e("base",.04,.27,.92,.32) + e("top",0,.17,.52,.3) + e("top",.22,0,.52,.42) + e("top",.5,.1,.48,.34) + e("top",.3,.2,.4,.22) + `</div></div>`;

  $("sky-layer").innerHTML = h;

  drawCrops(wind);
}

/* maize row across the full card width, swaying faster in stronger wind */

/* ---------- long-range outlook: weeks 3–6 and months 2–3 ----------
   Forecast: Open-Meteo seasonal API (ensemble, daily). Normals: ERA5 1991–2020 from Open-Meteo archive.
   We compare the ensemble-mean total/average for each window with the 30-year normal for the same calendar days.
   Results are cached (forecast 12 h, normals 30 days). If anything fails, the cards say "not available". */
const OUT = { rainPct: 25, minNormalMm: 5, tempC: 0.5 };
function cacheGet(k, maxH){ try { const o = JSON.parse(localStorage.getItem(k)||"null"); if (o && (Date.now()-o.t) < maxH*3600e3) return o.d; } catch(e){} return null; }
function cacheSet(k, d){ try { localStorage.setItem(k, JSON.stringify({ t:Date.now(), d })); } catch(e){} }
function memberMean(daily, base){
  // average all keys that start with base (e.g. precipitation_sum, precipitation_sum_member01 …)
  const keys = Object.keys(daily).filter(k => k === base || k.startsWith(base + "_member"));
  if (!keys.length) return null;
  return daily.time.map((_,i) => { let s=0,n=0; for (const k of keys){ const v = daily[k][i]; if (v !== null && v !== undefined && Number.isFinite(v)){ s+=v; n++; } } return n ? s/n : null; });
}
async function getSeasonal(){
  const key = `muuni-seas-${CFG.lat},${CFG.lon}`;
  const c = cacheGet(key, 12); if (c) return c;
  const base = `https://seasonal-api.open-meteo.com/v1/seasonal?latitude=${CFG.lat}&longitude=${CFG.lon}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&timezone=${encodeURIComponent(CFG.tz)}&forecast_days=100`;
  for (const url of [base + "&models=ecmwf_seas5", base]){
    try { const d = await getJSON(url); if (d && d.daily && d.daily.time && d.daily.time.length > 40){ const r = { time:d.daily.time, p:memberMean(d.daily,"precipitation_sum"), tx:memberMean(d.daily,"temperature_2m_max"), tn:memberMean(d.daily,"temperature_2m_min") }; if (r.p){ cacheSet(key, r); return r; } } } catch(e){}
  }
  return null;
}
async function getNormals(){
  const key = `muuni-norm-${CFG.lat},${CFG.lon}`;
  const c = cacheGet(key, 24*30); if (c) return c;
  try {
    const d = await getJSON(`https://archive-api.open-meteo.com/v1/archive?latitude=${CFG.lat}&longitude=${CFG.lon}&start_date=1991-01-01&end_date=2020-12-31&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&timezone=${encodeURIComponent(CFG.tz)}`);
    // per calendar day (MM-DD): mean precipitation and mean temperature across 30 years
    const acc = {};
    d.daily.time.forEach((t0,i) => { const md = t0.slice(5); const a = acc[md] || (acc[md] = { p:0, t:0, n:0, nt:0 });
      const p = d.daily.precipitation_sum[i], tx = d.daily.temperature_2m_max[i], tn = d.daily.temperature_2m_min[i];
      if (p !== null){ a.p += p; a.n++; } if (tx !== null && tn !== null){ a.t += (tx+tn)/2; a.nt++; } });
    const out = {}; for (const md in acc){ const a = acc[md]; out[md] = [a.n ? a.p/a.n : null, a.nt ? a.t/a.nt : null]; }
    cacheSet(key, out); return out;
  } catch(e){ return null; }
}
function windowStats(fc, norm, from, to){
  let fp=0, np=0, ft=0, nt=0, n=0;
  fc.time.forEach((d,i) => { if (d < from || d > to) return; const nm = norm[d.slice(5)] || norm["02-28"];
    if (fc.p[i] === null || !nm || nm[0] === null) return;
    fp += fc.p[i]; np += nm[0]; if (fc.tx && fc.tn && fc.tx[i] !== null && fc.tn[i] !== null && nm[1] !== null){ ft += (fc.tx[i]+fc.tn[i])/2; nt += nm[1]; } n++; });
  if (!n) return null;
  const rain = np < OUT.minNormalMm && fp < OUT.minNormalMm ? "drys" : fp >= np*(1+OUT.rainPct/100) ? "wet" : fp <= np*(1-OUT.rainPct/100) ? "dry" : "norm";
  const dT = (ft - nt)/n;
  const temp = dT >= OUT.tempC ? "warm" : dT <= -OUT.tempC ? "cool" : "tnorm";
  return { rain, temp, fp, np, days:n };
}
const addDays = (k, n) => dkFmt.format(new Date(Date.parse(k+"T12:00:00Z") + n*864e5));
async function loadOutlook(){
  try {
    const [fc, norm] = await Promise.all([getSeasonal(), getNormals()]);
    if (!fc || !norm){ S.out = { err:true }; render(); return; }
    const today = todayKey(), rows = [], mrows = [];
    for (let w=3; w<=6; w++){ const from = addDays(today,(w-1)*7), to = addDays(today,w*7-1); const st = windowStats(fc,norm,from,to); if (st && st.days >= 5) rows.push({ kind:"week", w, from, to, ...st }); }
    const now = new Date(Date.parse(today+"T12:00:00Z"));
    for (let m=1; m<=2; m++){
      const y = now.getUTCFullYear(), mo = now.getUTCMonth()+m, first = new Date(Date.UTC(y,mo,1)), last = new Date(Date.UTC(y,mo+1,0));
      const from = first.toISOString().slice(0,10), to = last.toISOString().slice(0,10);
      const st = windowStats(fc,norm,from,to); if (st && st.days >= 20) mrows.push({ kind:"month", from, to, ...st });
    }
    S.out = { rows, mrows, err: !rows.length && !mrows.length };
  } catch(e){ S.out = { err:true }; }
  render();
}
function renderOutlook(){
  const o = S.out;
  const na = `<div class="n" style="padding:14px 0">${o ? t("o_na") : t("loading")}</div>`;
  const dfm = new Intl.DateTimeFormat(LANG==="ny"?"en-GB":"en-GB",{ day:"numeric", month:"short", timeZone:"UTC" });
  const mfm = new Intl.DateTimeFormat("en-GB",{ month:"long", year:"numeric", timeZone:"UTC" });
  const rainIc = r => r==="wet" ? wxIcon("rain",20) : r==="dry" || r==="drys" ? wxIcon("clear",20) : wxIcon("cloudy",20);
  const row = (when, sub, r) => `<div class="orow"><div class="when">${when}<small>${sub}</small></div>
      <div class="tag ${r.rain==="wet"?"wet":r.rain==="dry"?"dry":"norm"}">${rainIc(r.rain)}${t("o_"+r.rain)}</div>
      <div class="tag ${r.temp==="warm"?"warm":r.temp==="cool"?"cool":"norm"}">🌡 ${t("o_"+r.temp)}</div></div>`;
  if (!o || o.err){ $("out-weeks").innerHTML = na; $("out-months").innerHTML = na; return; }
  (o.rows||[]).forEach(r => r.label = `${dfm.format(new Date(r.from+"T12:00:00Z"))} – ${dfm.format(new Date(r.to+"T12:00:00Z"))}`);

  $("out-months").innerHTML = (o.mrows||[]).length ? o.mrows.map(r => row(r.label, "", r)).join("") : na;

/* ---------- Planting time advisor (maize) ----------
   Onset rule: about 25 mm measured within 3 days in the last 10 days, seed zone moist,
   and no dry spell of 10+ days starting in the next 14 days. Guidance, not a guarantee. */
function plantingAdvice(){
  const P = CFG.maize, f = S.fc, today = todayKey(), md = today.slice(5);
  const inSeason = md >= P.seasonStart || md <= P.seasonEnd;
  if (!inSeason) return { status:"out", reasons:[], conf:null };
  const dfm = k => new Intl.DateTimeFormat("en-GB",{ day:"numeric", month:"short", timeZone:"UTC" }).format(new Date(k+"T12:00:00Z"));
  const y = +today.slice(0,4), seasonStartKey = (md >= P.seasonStart ? y : y-1) + "-" + P.seasonStart;
  // measured rain + data coverage per day (10-minute buckets)
  const rd = rainByDay(), cov = {};
  S.wSeries.forEach(e => { const k = e.created_at.slice(0,10); cov[k] = (cov[k]||0) + 1; });
  const stationOK = !isStale(S.wLast) && [1,2].every(n => (cov[dayKeyOffset(n)]||0) >= 108);   // ≥18 h of data on each of the last 2 full days
  let best = 0, onsetDay = null;
  for (let n = 0; ; n++){ const k = dayKeyOffset(n); if (k < seasonStartKey || n > 120) break;
    const sum = [0,1,2].reduce((a,i)=>a+(rd[dayKeyOffset(n+i)]||0),0);
    if (sum > best) best = sum;
    if (sum >= P.onsetMm && n <= P.onsetRecentDays && onsetDay === null) onsetDay = { k, sum }; }
  const reasons = [];
  // forecast: dry run + coming window
  let dryRun = null, win = null;
  if (f && f.daily){
    const pr = f.daily.precipitation_sum, pc = f.daily.precipitation_probability_max, tm = f.daily.time;
    const dry = tm.map((_,i) => (pr[i]||0) < P.dryDayMm && (pc[i]??0) < P.dryDayChance);
    for (let i=0; i<Math.min(P.lookaheadDays, tm.length) && !dryRun; i++){ if (!dry[i] || (i>0 && dry[i-1])) continue;
      let j=i; while (j < tm.length && dry[j]) j++; if (j-i >= P.dryRunDays) dryRun = { from:tm[i], n:j-i }; }
    for (let i=0; i+2<Math.min(7,tm.length) && !win; i++){ const sum = pr[i]+pr[i+1]+pr[i+2], ch = Math.max(pc[i]??0,pc[i+1]??0,pc[i+2]??0);
      if (sum >= P.onsetMm && ch >= P.windowChance) win = { from:tm[i], to:tm[i+2], sum, ch }; }
  }
  const outDry = (S.out && S.out.adv || []).find(r => r.kind === "week" && r.w <= 4 && r.rain === "dry");
  const monthsDry = (S.out && S.out.adv || []).some(r => r.kind === "month" && r.rain === "dry");
  // soil
  const sm = S.sLast ? num(S.sLast.field1) : null, ec = S.sLast ? num(S.sLast.field3) : null;
  const soilValid = sm !== null && sm >= 5 && ec !== 0 && !isStale(S.sLast);
  let status;
  if (stationOK && onsetDay){
    reasons.push({ t: t("pl_onset").replace("{m}", fmt(onsetDay.sum)), src:"m" });
    if (soilValid) reasons.push({ t: t(sm >= P.soilMin ? "pl_soilok" : "pl_soildry").replace("{m}", fmt(sm,0)), src:"m" });
    else reasons.push({ t: t("pl_soilna"), src:"m" });
    if (dryRun) reasons.push({ t: t("pl_dry").replace("{n}", dryRun.n).replace("{d}", dfm(dryRun.from)), src:"f" });
    else if (f) reasons.push({ t: t("pl_nodry"), src:"f" });
    if (outDry) reasons.push({ t: t("pl_outdry").replace("{d}", outDry.label || dfm(outDry.from)), src:"o" });
    status = (dryRun || outDry) ? "risk" : (soilValid && sm < P.soilMin) ? "soil" : "good";
  } else {
    if (!stationOK) reasons.push({ t: t("pl_off"), src:"f" });
    else reasons.push({ t: t("pl_sofar").replace("{m}", fmt(best)), src:"m" });
    if (win){ reasons.push({ t: t("pl_fcwin").replace("{m}", fmt(win.sum,0)).replace("{d}", `${dfm(win.from)}–${dfm(win.to)}`).replace("{c}", win.ch), src:"f" });
      if (dryRun) reasons.push({ t: t("pl_dry").replace("{n}", dryRun.n).replace("{d}", dfm(dryRun.from)), src:"f" }); }
    status = win ? "win" : (!stationOK ? "unk" : "not");
  }
  if (md > P.latePlanting && md <= "12-31" || md <= P.seasonEnd && md < P.seasonStart || monthsDry) reasons.push({ t: t("pl_var"), src: monthsDry ? "o" : "f" });
  const conf = !stationOK ? "lo" : (!soilValid || !f) ? "med" : "hi";
  return { status, reasons, conf, win };
}
function renderPlanting(){
  const a = plantingAdvice(), el = $("plant");
  const titles = { soil:t("pl_soil"), unk:t("pl_unk"), not:t("pl_not"), win:t("pl_win") + (a.win ? `: ${new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",timeZone:"UTC"}).format(new Date(a.win.from+"T12:00:00Z"))}–${new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",timeZone:"UTC"}).format(new Date(a.win.to+"T12:00:00Z"))}` : ""), good:t("pl_good"), risk:t("pl_risk"), out:t("pl_out") };
  el.textContent = titles[a.status]; el.className = "ttl " + ({ good:"good", win:"caution", risk:"no", not:"no", soil:"caution", unk:"caution", out:"" }[a.status]);
  const lab = { m:t("measured"), f:t("forecast"), o:t("outlook") };
  const main = a.reasons.find(r => r.src === "m") ? "m" : a.reasons.find(r => r.src === "f") ? "f" : "o";
  const src = $("plant-src"); src.className = "pill " + (a.status === "out" ? "" : main); src.textContent = a.status === "out" ? "" : lab[main];
  $("plant-conf").textContent = a.conf ? `${t("pl_conf")}: ${t("pl_" + a.conf)}` : "";
  const rs = a.reasons.map(r => `<li>${r.t} <span class="pill ${r.src}" style="font-size:9.5px">${lab[r.src]}</span></li>`);
  if (L(CFG.dccms)) rs.push(`<li><b>${t("pl_dccms")}:</b> ${L(CFG.dccms)} <span class="n">(${CFG.dccms.source}${CFG.dccms.date ? ", " + CFG.dccms.date : ""})</span></li>`);
  if (CFG.exhibitionMode && a.status !== "out") rs.push(`<li>${t("p_ex")}</li>`);
  $("plant-r").innerHTML = rs.join("");
  $("plant-note").textContent = a.status === "out" ? "" : t("pl_note");
}

function renderAdvice(){
  const w = S.wLast, f = S.fc, stale = isStale(w), i = hourIndexNow();
  const r = []; let level = 2;
  let wind = (!stale && w) ? num(w.field4) : null, usedFc = false;
  if (wind === null && f && i >= 0){ wind = f.hourly.wind_speed_10m[i]; usedFc = true; r.push(t("r_fcwind")); }
  if (wind !== null){
    if (wind > 3.5){ level = 0; r.push(`${t("r_windy")} (${fmt(wind)} m/s)`); }
    else if (wind < 0.5){ level = Math.min(level,1); r.push(`${t("r_calm")} (${fmt(wind)} m/s)`); }
    else r.push(`${t("r_windok")} (${fmt(wind)} m/s)`);
  }
  const r1h = (!stale && w) ? num(w.field8) : null;
  if (r1h !== null && r1h > 0){ level = 0; r.push(t("r_wet")); }
  if (f && i >= 0){
    const p6 = Math.max(...f.hourly.precipitation_probability.slice(i, i+6).map(v=>v??0));
    if (p6 >= 50){ level = 0; r.push(`${t("r_rainsoon")} (${p6}%)`); } else r.push(`${t("r_dry6")} (${p6}%)`);
    const temp = (!stale && w && num(w.field1) !== null) ? num(w.field1) : f.hourly.temperature_2m[i];
    if (temp > 32){ level = Math.min(level,1); r.push(`${t("r_hot")} (${fmt(temp)}°C)`); }
  }
  if (usedFc) level = Math.min(level,1);
  const src = $("spray-src"); src.className = "pill " + (usedFc ? "f" : "m"); src.textContent = usedFc ? t("forecast") : t("measured");
  const sv = $("spray"); sv.textContent = [t("s_no"),t("s_caution"),t("s_good")][level]; sv.className = "ttl " + ["no","caution","good"][level];
  $("spray-r").innerHTML = r.map(x=>`<li>${x}</li>`).join("");

  renderPlanting();
}

function renderRain(){
  const rd = rainByDay(), today = todayKey(), stale = isStale(S.wLast), has = S.wSeries.length > 0;
  const r7 = [0,1,2,3,4,5,6].reduce((a,n)=>a+(rd[dayKeyOffset(n)]||0),0);
  const season = Object.entries(rd).filter(([k])=>k >= CFG.seasonStart).reduce((a,[,v])=>a+v,0);
  $("rain-grid").innerHTML =
    ic("drop", t("r_today"), has?fmt(rd[today]||0):"—", "mm", "", stale) +
    ic("clock", t("r_1h"), fmt(S.wLast?num(S.wLast.field8):null), "mm", "", stale) +
    ic("chart", t("r_7"), has?fmt(r7):"—", "mm", "", stale) +
    ic("leaf", t("r_season"), has?fmt(season):"—", "mm", `<div class="n">${t("r_since")}</div>`, stale);
  const f = S.fc;
  $("cmp").textContent = (has && f && f.daily) ? " " + t("cmp_t").replace("{f}", fmt(f.daily.precipitation_sum[0])).replace("{m}", fmt(rd[today]||0)) : " " + t("cmp_na");
  const days = [6,5,4,3,2,1,0].map(n => dayKeyOffset(n));
  $("rain-bars").innerHTML = barChart(days.map(k => ({label:k.slice(8,10)+"/"+k.slice(5,7), v: rd[k]||0})), null, "#1E6B45", true);
}

function setRange(d){ S.range = d; $("r24").classList.toggle("on", d===1); $("r7").classList.toggle("on", d===7); renderCharts(); }
function renderCharts(){
  const since = Date.now() - S.range*864e5;
  const ws = S.wSeries.filter(e => Date.parse(e.created_at) >= since), ss = S.sSeries.filter(e => Date.parse(e.created_at) >= since);
  const soil = series(ss,"field1").filter(p => p.v >= 5);
  $("chart-grid").innerHTML =
    `<div class="card"><div class="k2">${t("c_temp")}</div>${lineChart(series(ws,"field1"),"#C2410C")}</div>` +
    `<div class="card"><div class="k2">${t("c_hum")}</div>${lineChart(series(ws,"field2"),"#1D5FA8")}</div>` +
    `<div class="card"><div class="k2">${t("c_wind")}</div>${lineChart(series(ws,"field4"),"#56615A")}</div>` +
    `<div class="card"><div class="k2">${t("c_soil")}</div>${lineChart(soil,"#1E6B45")}</div>`;
}
function lineChart(pts, color){
  if (pts.length < 2) return `<div class="n" style="padding:34px 0;text-align:center">${t("nochart")}</div>`;
  const W=340,H=150,l=34,r=8,tp=10,b=22;
  let mn = Math.min(...pts.map(p=>p.v)), mx = Math.max(...pts.map(p=>p.v));
  if (mx - mn < 1){ mx += .5; mn -= .5; } const pad = (mx-mn)*.1; mn -= pad; mx += pad;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const X = x => l + (x - t0)/(t1 - t0 || 1)*(W-l-r), Y = y => tp + (1 - (y - mn)/(mx - mn))*(H-tp-b);
  let d = "", prev = null;
  for (const p of pts){ d += (prev === null || p.t - prev > 35*60000 ? "M" : "L") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1); prev = p.t; }
  const tf = new Intl.DateTimeFormat("en-GB", S.range===1 ? {hour:"2-digit",minute:"2-digit",timeZone:CFG.tz} : {day:"numeric",month:"short",timeZone:CFG.tz});
  const grid = [mn+pad, (mn+mx)/2, mx-pad].map(v => `<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E4E0D5"/><text x="${l-4}" y="${Y(v)+3}" text-anchor="end">${v.toFixed(Math.abs(mx-mn)<10?1:0)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${l}" y="${H-6}">${tf.format(new Date(t0))}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${tf.format(new Date(t1))}</text></svg>`;
}
function barChart(items, maxV, color, showVals){
  const W=340,H=130,l=8,r=8,tp=14,b=20, n = items.length || 1;
  const mx = maxV ?? Math.max(1, ...items.map(i=>i.v)); const bw = (W-l-r)/n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">` + items.map((it,i)=>{
    const h = (it.v/mx)*(H-tp-b), x = l + i*bw + bw*.15, y = H-b-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${Math.max(h,0.5).toFixed(1)}" rx="3" fill="${color}"/>` +
      (showVals ? `<text x="${(x+bw*.35).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle">${it.v.toFixed(1)}</text>` : "") +
      (it.label ? `<text x="${(x+bw*.35).toFixed(1)}" y="${H-6}" text-anchor="middle">${it.label}</text>` : "");
  }).join("") + `</svg>`;
}


/* clean CSV built in the browser: named columns with units, date and time split, empty periods removed */
const COLS = {
  weather: ["air_temp_C","humidity_pct","pressure_hPa","wind_speed_m_s","wind_dir_deg","rain_total_mm","wind_gust_m_s","rain_last_hour_mm"],
  soil:    ["soil_moisture_pct","soil_temp_C","soil_EC_uS_cm","soil_pH","N_mg_kg","P_mg_kg","K_mg_kg"]
};
function siteFor(day){
  const d = CFG.deployments.find(x => day >= x.from && (!x.to || day <= x.to));
  return d ? d.en : "";
}
let XLSX_READY = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  if (!XLSX_READY) XLSX_READY = new Promise((ok, bad) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = ok; sc.onerror = () => { XLSX_READY = null; bad(); };
    document.head.appendChild(sc);
  });
  return XLSX_READY;
}
async function downloadData(e, kind){
  e.preventDefault();
  const chName = $("dl-ch").value, ch = CFG[chName], from = $("dl-from").value, to = $("dl-to").value, res = $("dl-res").value, msg = $("dl-msg");
  msg.style.color = "var(--muted)"; msg.textContent = t("dl_wait");
  try {
    const url = `${tsBase}${ch.id}/feeds.json?api_key=${ch.key}&timezone=${encodeURIComponent(CFG.tz)}&start=${from}%2000:00:00&end=${to}%2023:59:59${res?`&average=${res}`:""}`;
    const [d] = await Promise.all([getJSON(url), kind === "xlsx" ? loadXLSX() : null]);
    const cols = COLS[chName];
    const rows = (d.feeds || []).filter(f => cols.some((_,i) => num(f["field"+(i+1)]) !== null));
    if (!rows.length){ msg.style.color = "var(--amber)"; msg.textContent = t("dl_none"); return; }
    const head = ["date","time_CAT","site", ...cols];
    const data = rows.map(f => {
      const day = f.created_at.slice(0,10);
      return [day, f.created_at.slice(11,16), siteFor(day), ...cols.map((_,i) => { const v = num(f["field"+(i+1)]); return v === null ? null : Math.round(v*100)/100; })];
    });
    const step = res === "" ? "raw" : res === "daily" ? "daily" : res === "60" ? "hourly" : res + "min";
    const base = `muuni_${chName}_${from}_to_${to}_${step}`;
    if (kind === "xlsx"){
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet([head, ...data]);
      ws["!cols"] = head.map(h => ({ wch: h === "site" ? 44 : Math.max(11, h.length + 2) }));
      ws["!autofilter"] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:data.length, c:head.length-1}}) };
      ws["!freeze"] = { xSplit: 0, ySplit: 1 };
      XLSX.utils.book_append_sheet(wb, ws, chName === "weather" ? "Weather data" : "Soil data");
      const dict = DICT.filter(x => x[0] === chName).map((x,i) => [cols[i], x[2], x[3], x[4]]);
      const about = XLSX.utils.aoa_to_sheet([
        ["Muuni Open Weather & Soil Station: " + (chName === "weather" ? "weather" : "soil") + " data"],
        [],
        ["Period", `${from} to ${to}`], ["Time step", step], ["Time zone", "Central Africa Time (UTC+2)"], ["Rows", data.length],
        ["Source", `ThingSpeak channel ${ch.id}`], ["Licence", "CC BY 4.0 (free to use with credit)"],
        ["Cite as", $("cite").textContent], ["Downloaded", new Date().toISOString().slice(0,16).replace("T"," ") + " UTC"],
        [], ["Column","Variable","Unit","Sensor"], ...dict
      ]);
      about["!cols"] = [{wch:22},{wch:40},{wch:22},{wch:34}];
      XLSX.utils.book_append_sheet(wb, about, "About this data");
      XLSX.writeFile(wb, base + ".xlsx");
    } else {
      const csv = [head.join(","), ...data.map(r => r.map((v,i) => i === 2 ? `"${v}"` : (v === null ? "" : v)).join(","))].join("\r\n");
      const blob = new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = base + ".csv";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    msg.style.color = "var(--green)"; msg.textContent = t("dl_ok").replace("{n}", rows.length);
  } catch(err){ msg.style.color = "var(--red)"; msg.textContent = t("dl_err"); }
}

function renderDownload(){
  const ch = CFG[$("dl-ch").value], from = $("dl-from").value, to = $("dl-to").value, res = $("dl-res").value, tz = encodeURIComponent(CFG.tz);
  const q = `api_key=${ch.key}&timezone=${tz}&start=${from}%2000:00:00&end=${to}%2023:59:59${res?`&average=${res}`:""}`;
  $("dl-csv").href = "#";
  $("dl-json").href = `${tsBase}${ch.id}/feeds.json?${q}`;
  $("api1").textContent = `${tsBase}${CFG.weather.id}/feeds/last.json?api_key=${CFG.weather.key}`;
  $("api2").textContent = `${tsBase}${CFG.soil.id}/feeds/last.json?api_key=${CFG.soil.key}`;
}

function renderHealth(){
  const w = S.wLast, since = Date.now() - 7*864e5;
  const buckets = new Set(S.wSeries.filter(e => Date.parse(e.created_at) >= since).map(e => Math.floor(Date.parse(e.created_at)/6e5)));
  const first = S.wSeries.length ? Math.max(since, Date.parse(S.wSeries[0].created_at)) : null;
  const expected = first ? Math.max(1, Math.round((Date.now()-first)/6e5)) : null;
  const cov = expected ? Math.min(100, buckets.size/expected*100) : null;
  $("health-grid").innerHTML =
    ic("clock", t("h_last"), w && w.created_at ? agoText(Date.now()-Date.parse(w.created_at)) : "—", "", "") .replace('class="v"','class="v" style="font-size:20px"') +
    ic("chart", t("h_up"), cov===null?"—":fmt(cov,0), "%", "") +
    ic("db", t("h_rec"), S.wChan ? Number(S.wChan.last_entry_id).toLocaleString("en") : "—", "", "").replace('class="v"','class="v" style="font-size:22px"') +
    ic("db", t("h_rec2"), S.sChan ? Number(S.sChan.last_entry_id).toLocaleString("en") : "—", "", "").replace('class="v"','class="v" style="font-size:22px"');
}

function renderStatic(){
  $("dict").innerHTML = DICT.map(d => `<tr><td>${d[0]==="weather"?t("ch_w"):t("ch_s")} · ${d[1]}</td><td>${d[2]}</td><td>${d[3]}</td><td>${d[4]}</td></tr>`).join("");
  $("deps").innerHTML = CFG.deployments.map(d => `<tr><td>${L(d)}</td><td>${d.from}</td><td>${d.to || t("now")}</td></tr>`).join("");
  $("author").textContent = CFG.author;
  $("contact-wrap").innerHTML = CFG.contactEmail ? ` · <a href="mailto:${CFG.contactEmail}">${CFG.contactEmail}</a>` : "";
  const url = location.href.split("#")[0];
  $("cite").textContent = `${CFG.author} (${new Date().getFullYear()}). Muuni Open Weather & Soil Station data, Malawi [Data set]. ThingSpeak channels ${CFG.weather.id} (weather) and ${CFG.soil.id} (soil). Licence CC BY 4.0. ${url}`;
}

function setLang(l){ LANG = l; try { localStorage.setItem("muuni-lang", l); } catch(e) {} render(); }


/* ---------- init ---------- */
$("dl-to").value = todayKey(); $("dl-from").value = dayKeyOffset(7);
["dl-ch","dl-from","dl-to","dl-res"].forEach(id => $(id).addEventListener("change", renderDownload));
render();
loadAll();
loadOutlook();
setInterval(loadOutlook, 6*3600e3);
setTimeout(spawnBirds, 3000);
setTimeout(spawnPlane, 18000);
setInterval(loadAll, 60000);
</script>
